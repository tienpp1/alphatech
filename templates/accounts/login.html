<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Đăng nhập hệ thống — Nền tảng Doanh nghiệp AI">
    <title>Đăng nhập | Nền tảng Doanh nghiệp AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-dark text-light" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem 1rem; background-color: var(--bg-base); background-image: radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 40%), radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.10) 0%, transparent 40%); margin: 0;">
    
    <div style="max-width: 440px; width: 100%; margin: auto;">
        <!-- Brand Header (Centered Logo & Titles) -->
        <div style="text-align: center; margin-bottom: 1.75rem;">
            <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 0 30px rgba(99, 102, 241, 0.45); margin-bottom: 1rem;">
                ⚡
            </div>
            <div style="font-size: 0.85rem; font-weight: 700; color: #818cf8; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.25rem;">
                Nền tảng Doanh nghiệp AI
            </div>
            <h1 style="font-size: 1.75rem; font-weight: 800; color: #f8fafc; margin-bottom: 0.4rem; letter-spacing: -0.02em;">
                Đăng nhập hệ thống
            </h1>
            <p style="color: #94a3b8; font-size: 0.95rem; margin: 0;">
                Truy cập không gian làm việc doanh nghiệp
            </p>
        </div>

        <!-- Login Card -->
        <div class="card glass-card" style="padding: 2.25rem 2rem; border-radius: 18px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px);">
            {% if error %}
            <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.35); color: #fca5a5; padding: 0.85rem 1rem; border-radius: 10px; margin-bottom: 1.5rem; font-size: 0.9rem; display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 1.1rem;">⚠️</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            {% if logged_out %}
            <div style="background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.35); color: #7dd3fc; padding: 0.85rem 1rem; border-radius: 10px; margin-bottom: 1.5rem; font-size: 0.9rem; display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 1.1rem;">ℹ️</span>
                <span>Bạn đã đăng xuất khỏi hệ thống thành công.</span>
            </div>
            {% endif %}

            <form method="POST" action="/accounts/login/">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <div style="margin-bottom: 1.25rem;">
                    <label for="username" style="display: block; font-size: 0.875rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.5rem;">
                        Tên đăng nhập / Email
                    </label>
                    <input type="text" id="username" name="username" required autofocus placeholder="Ví dụ: manager hoặc employee"
                           style="width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 0.8rem 1rem; color: #f8fafc; font-size: 0.95rem; outline: none; transition: all 0.2s; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);"
                           onfocus="this.style.borderColor='#6366f1'; this.style.boxShadow='0 0 0 3px rgba(99, 102, 241, 0.2)';"
                           onblur="this.style.borderColor='#334155'; this.style.boxShadow='inset 0 2px 4px rgba(0,0,0,0.3)';">
                </div>

                <div style="margin-bottom: 1.75rem;">
                    <label for="password" style="display: block; font-size: 0.875rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.5rem;">
                        Mật khẩu
                    </label>
                    <input type="password" id="password" name="password" required placeholder="••••••••••••"
                           style="width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 0.8rem 1rem; color: #f8fafc; font-size: 0.95rem; outline: none; transition: all 0.2s; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);"
                           onfocus="this.style.borderColor='#6366f1'; this.style.boxShadow='0 0 0 3px rgba(99, 102, 241, 0.2)';"
                           onblur="this.style.borderColor='#334155'; this.style.boxShadow='inset 0 2px 4px rgba(0,0,0,0.3)';">
                </div>

                <button type="submit" id="btn-login-submit"
                        style="width: 100%; box-sizing: border-box; background: linear-gradient(135deg, #6366f1, #4f46e5); color: #ffffff; border: none; padding: 0.85rem; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);"
                        onmouseover="this.style.transform='translateY(-1px)'; this.style.boxShadow='0 6px 25px rgba(99, 102, 241, 0.5)';"
                        onmouseout="this.style.transform='none'; this.style.boxShadow='0 4px 20px rgba(99, 102, 241, 0.4)';">
                    Đăng nhập
                </button>
            </form>

            <!-- Quick Dev Credentials Hint -->
            <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid rgba(255, 255, 255, 0.08);">
                <span style="font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; display: block; margin-bottom: 0.6rem;">
                    Tài khoản thử nghiệm nội bộ (Môi trường Dev):
                </span>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 0.8rem;">
                    <button type="button" onclick="fillCreds('admin', 'AdminPass123!')"
                            style="background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); color: #cbd5e1; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-align: left; transition: background 0.15s;"
                            onmouseover="this.style.background='rgba(255, 255, 255, 0.08)'"
                            onmouseout="this.style.background='rgba(255, 255, 255, 0.04)'">
                        ⚡ <strong>admin</strong> (Quản trị viên)
                    </button>
                    <button type="button" onclick="fillCreds('manager', 'ManagerPass123!')"
                            style="background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); color: #cbd5e1; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-align: left; transition: background 0.15s;"
                            onmouseover="this.style.background='rgba(255, 255, 255, 0.08)'"
                            onmouseout="this.style.background='rgba(255, 255, 255, 0.04)'">
                        👔 <strong>manager</strong> (Quản lý)
                    </button>
                    <button type="button" onclick="fillCreds('employee', 'EmployeePass123!')"
                            style="background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); color: #cbd5e1; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-align: left; transition: background 0.15s;"
                            onmouseover="this.style.background='rgba(255, 255, 255, 0.08)'"
                            onmouseout="this.style.background='rgba(255, 255, 255, 0.04)'">
                        💼 <strong>employee</strong> (Nhân viên)
                    </button>
                    <button type="button" onclick="fillCreds('viewer', 'ViewerPass123!')"
                            style="background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); color: #cbd5e1; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-align: left; transition: background 0.15s;"
                            onmouseover="this.style.background='rgba(255, 255, 255, 0.08)'"
                            onmouseout="this.style.background='rgba(255, 255, 255, 0.04)'">
                        👁️ <strong>viewer</strong> (Người xem)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
    function fillCreds(u, p) {
        document.getElementById('username').value = u;
        document.getElementById('password').value = p;
    }
    </script>
</body>
</html>

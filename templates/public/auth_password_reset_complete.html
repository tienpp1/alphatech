<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu thành công | Nền tảng Doanh nghiệp AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pub-bg: #F8FAFC;
            --pub-card: #FFFFFF;
            --pub-border: #E2E8F0;
            --pub-primary: #2563EB;
            --pub-primary-hover: #1D4ED8;
            --pub-text-heading: #0F172A;
            --pub-text-body: #334155;
            --pub-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --pub-radius: 16px;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--pub-bg);
            color: var(--pub-text-body);
            margin: 0;
            padding: 2.5rem 1rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .auth-container { max-width: 440px; width: 100%; margin: auto; }
        .auth-card {
            background: var(--pub-card);
            border: 1px solid var(--pub-border);
            border-radius: var(--pub-radius);
            box-shadow: var(--pub-shadow);
            padding: 2.5rem 2rem;
            text-align: center;
            border-top: 3px solid #10B981;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div style="width: 58px; height: 58px; background: #ECFDF5; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #10B981; margin-bottom: 1.25rem; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <h1 style="font-size: 1.55rem; font-weight: 800; color: var(--pub-text-heading); margin: 0 0 0.5rem; letter-spacing: -0.02em;">
                Đặt lại mật khẩu thành công!
            </h1>
            <p style="color: var(--pub-text-body); font-size: 0.95rem; line-height: 1.55; margin: 0 0 1.75rem;">
                Mật khẩu tài khoản của bạn đã được cập nhật an toàn. Bây giờ bạn có thể đăng nhập bằng mật khẩu mới.
            </p>
            <a href="/dang-nhap/" style="display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--pub-primary); color: #fff; text-decoration: none; padding: 13px; border-radius: 10px; font-weight: 700; font-size: 0.98rem; box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);">
                <span>Đăng nhập ngay</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </a>
        </div>
    </div>
</body>
</html>
